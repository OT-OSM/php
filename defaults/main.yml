---
php_version: "8.1"

php_packages_debian:
  - "php{{ php_version }}"
  - "php{{ php_version }}-cli"
  - "php{{ php_version }}-fpm"
  - "php{{ php_version }}-mysql"
  - "php{{ php_version }}-curl"
  - "php{{ php_version }}-xml"
  - "php{{ php_version }}-mbstring"
  - "libapache2-mod-php{{ php_version }}"

php_packages_redhat:
  - php
  - php-mysql

php_ini_path_debian: "/etc/php/{{ php_version }}/apache2/php.ini"
php_ini_path_redhat: "/etc/php.ini"
